version: 3
automerge: true
projects:
  - name: dev
    dir: infra/environments/dev
    terraform_version: v1.15.5
    autoplan:
      when_modified:
        - "**/*.tf"
        - ".terraform.lock.hcl"
        - "../../modules/**/*.tf"

  - name: prod
    dir: infra/environments/prod
    terraform_version: v1.15.5
    apply_requirements: [approved, mergeable]
    autoplan:
      when_modified:
        - "**/*.tf"
        - ".terraform.lock.hcl"
        - "../../modules/**/*.tf"
