apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: jiffy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/gaucho-racing/jiffy:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          envFrom:
            - secretRef:
                name: jiffy-secrets
          env:
            - name: ENV
              value: PROD
            - name: PORT
              value: "8080"
            - name: PREFIX
              value: "!"
            - name: DATABASE_HOST
              value: postgres.jiffy.svc.cluster.local
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              value: postgres
            - name: DATABASE_NAME
              value: jiffy
            - name: SENTINEL_URL
              value: https://sso.gauchoracing.com
            - name: SENTINEL_JWKS_URL
              value: https://sso.gauchoracing.com/.well-known/jwks.json
            - name: SENTINEL_CLIENT_ID
              value: MxgxnQFxKTNH
            - name: SENTINEL_REDIRECT_URI
              value: https://jiffy.gauchoracing.com/auth/login
            - name: DISCORD_GUILD
              value: "756738476887638107"
            - name: DISCORD_LOG_CHANNEL
              value: "1215431405211885669"
            - name: S3_REGION
              value: us-west-2
            - name: S3_BUCKET
              value: gr-jiffy-public
            - name: SHEETS_CRON
              value: "30 * * * *"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: jiffy
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
