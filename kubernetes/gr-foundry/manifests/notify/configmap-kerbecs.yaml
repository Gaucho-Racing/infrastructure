apiVersion: v1
kind: ConfigMap
metadata:
  name: kerbecs-config
  namespace: notify
data:
  kerbecs.yaml: |
    gateway:
      name: notify-gateway
      version: 0.1.0
      env: ${ENV:PROD}
      timeouts:
        dial: 5s
        headers: 30s
        idle: 50s
        overall: 0

    listeners:
      gateway:
        port: "10310"
      admin:
        port: "10300"
        auth:
          type: basic
          username: ${KERBECS_USER}
          password: ${KERBECS_PASSWORD}

    providers:
      static:
        watch: true
        watch_mode: poll
        watch_interval: 5s

    upstreams:
      notify:
        name: notify
        version: 0.1.0
        instances:
          - http://notify.notify.svc.cluster.local:9999
        health_check:
          path: /ping
          interval: 10s
          timeout: 3s

      web:
        name: notify-web
        version: 0.1.0
        instances:
          - http://web.notify.svc.cluster.local:80
        health_check:
          path: /healthz
          interval: 10s
          timeout: 3s

    routes:
      - name: notify-api
        match:
          path: /api/*
        upstream: notify
        rewrite:
          strip_prefix: /api
        envelope: passthrough

      - name: notify-web
        match:
          path: /*
        upstream: web
        envelope: passthrough
