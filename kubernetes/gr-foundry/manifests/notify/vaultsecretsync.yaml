apiVersion: vault.gauchoracing.com/v1alpha1
kind: VaultSecretSync
metadata:
  name: notify-secrets
  namespace: notify
spec:
  serviceAccountName: default
  target:
    name: notify-secrets
    type: Opaque
  refreshInterval: 5m
  rolloutTargets:
    - kind: Deployment
      name: notify
    - kind: Deployment
      name: kerbecs
  secrets:
    DATABASE_PASSWORD: postgres-prod.password
    DATABASE_USER: postgres-prod.username
    ENCRYPTION_KEY: notify-prod.encryption_key
    KERBECS_PASSWORD: notify-prod.kerbecs_password
    SENTINEL_CLIENT_SECRET: notify-prod.sentinel_client_secret
    SENTINEL_SA_TOKEN: notify-prod.sentinel_sa_token
