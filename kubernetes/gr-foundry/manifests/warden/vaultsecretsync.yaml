# Two syncs so the game server pod never holds the database or Sentinel
# credentials, and the backend never holds the relay token.
# PLUGIN_TOKEN is the one value both sides share.
apiVersion: vault.gauchoracing.com/v1alpha1
kind: VaultSecretSync
metadata:
  name: warden-secrets
  namespace: warden
spec:
  serviceAccountName: default
  target:
    name: warden-secrets
    type: Opaque
  refreshInterval: 5m
  rolloutTargets:
    - kind: Deployment
      name: server
    - kind: Deployment
      name: kerbecs
  secrets:
    DATABASE_USER: postgres-prod.username
    DATABASE_PASSWORD: postgres-prod.password
    SENTINEL_CLIENT_SECRET: warden-prod.sentinel_client_secret
    SENTINEL_SA_TOKEN: warden-prod.sentinel_sa_token
    PLUGIN_TOKEN: warden-prod.plugin_token
    KERBECS_USER: warden-prod.kerbecs_user
    KERBECS_PASSWORD: warden-prod.kerbecs_password
    DISCORD_TOKEN: warden-prod.discord_token
    DISCORD_CHANNEL_ID: warden-prod.discord_channel_id
---
apiVersion: vault.gauchoracing.com/v1alpha1
kind: VaultSecretSync
metadata:
  name: minecraft-secrets
  namespace: warden
spec:
  serviceAccountName: default
  target:
    name: minecraft-secrets
    type: Opaque
  refreshInterval: 5m
  rolloutTargets:
    - kind: StatefulSet
      name: minecraft
    - kind: Deployment
      name: frpc
  secrets:
    PLUGIN_TOKEN: warden-prod.plugin_token
    FRP_TOKEN: warden-prod.frp_token
