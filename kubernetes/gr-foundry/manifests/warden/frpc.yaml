# Dials out to the frps relay in AWS (infra/modules/minecraft-relay) and
# carries player traffic from its public 25565 back to the minecraft
# Service. play.gauchoracing.com is an unproxied A record on the relay's
# EIP; until it exists frpc just keeps retrying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frpc-config
  namespace: warden
data:
  frpc.toml: |
    serverAddr = "play.gauchoracing.com"
    serverPort = 7000
    loginFailExit = false
    auth.method = "token"
    auth.token = "{{ .Envs.FRP_TOKEN }}"
    transport.tls.enable = true

    [[proxies]]
    name = "minecraft"
    type = "tcp"
    localIP = "minecraft.warden.svc.cluster.local"
    localPort = 25565
    remotePort = 25565
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frpc
  namespace: warden
spec:
  # Two clients would fight over the same remotePort on frps.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frpc
  template:
    metadata:
      labels:
        app: frpc
    spec:
      containers:
        - name: frpc
          image: ghcr.io/fatedier/frpc:latest
          args: ["-c", "/etc/frp/frpc.toml"]
          env:
            - name: FRP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: FRP_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: frpc-config
              mountPath: /etc/frp
              readOnly: true
      volumes:
        - name: frpc-config
          configMap:
            name: frpc-config
