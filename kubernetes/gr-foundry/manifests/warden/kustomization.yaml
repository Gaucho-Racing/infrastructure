apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - vaultsecretsync.yaml
  - configmap-kerbecs.yaml
  - postgres.yaml
  - kerbecs.yaml
  - server.yaml
  - web.yaml
  - ingress.yaml
  - minecraft.yaml
  - frpc.yaml
  - networkpolicy.yaml

images:
  - name: ghcr.io/gaucho-racing/warden-server
    newTag: 1.5.0
  - name: ghcr.io/gaucho-racing/warden-web
    newTag: 1.5.0
  - name: ghcr.io/gaucho-racing/warden-minecraft
    newTag: 1.5.0
  - name: bk1031/kerbecs
    newTag: 3.2.0
  # Must match frp_version in infra/modules/minecraft-relay.
  - name: ghcr.io/fatedier/frpc
    newTag: v0.71.0
