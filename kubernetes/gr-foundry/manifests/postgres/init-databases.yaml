apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-databases
  namespace: postgres
data:
  01-create-databases.sh: |
    #!/usr/bin/env sh
    set -eu

    for database in vault sentinel jiffy mapache; do
      psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" --set=database="$database" <<'SQL'
    SELECT format('CREATE DATABASE %I', :'database')
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'database')
    \gexec
    SQL
    done
