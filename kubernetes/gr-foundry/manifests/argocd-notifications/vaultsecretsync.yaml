# Syncs the Notify service account token into argocd-notifications-secret,
# which the notifications controller reads for $notify-token.
#
# Manual bootstrap:
#   1. Add field notify_token to the Vault secret `argocd-prod`: a Sentinel
#      service account token for an application whose Notify policy allows
#      DISCORD.
#   2. Allow `argocd-prod.notify_token` in the Kubernetes access rule for
#      cluster gr-foundry, namespace argocd, service account default.

apiVersion: vault.gauchoracing.com/v1alpha1
kind: VaultSecretSync
metadata:
  name: argocd-notifications-secret
  namespace: argocd
spec:
  serviceAccountName: default
  target:
    name: argocd-notifications-secret
    type: Opaque
  refreshInterval: 5m
  secrets:
    notify-token: argocd-prod.notify_token
