# Syncs the Sentinel OIDC client credentials for ArgoCD from the Vault
# secret `argocd-prod` into the argocd namespace. argocd-server watches
# part-of=argocd secrets and hot-reloads settings, so no rolloutTargets.
#
# Manual bootstrap (in order):
#   1. Register the ArgoCD application in Sentinel:
#        - redirect_uri: https://argocd.gauchoracing.com/auth/callback
#        - link the ArgoAdmins and ArgoViewers groups so they appear in
#          the groups claim; optionally mark them required to gate login.
#      Sentinel auto-generates the client_id (random 12-char string).
#   2. Create the Vault secret `argocd-prod` with fields
#      oidc_client_id and oidc_client_secret from the registered app.
#   3. Add the Kubernetes access rule in the Vault UI (cluster gr-foundry,
#      namespace argocd, service account default, secret argocd-prod) —
#      without it the sync fails with a 403.
#   4. After the first successful sync, label the secret so ArgoCD will
#      resolve $argocd-sentinel-oidc:<key> references from it:
#        kubectl --context gr-foundry -n argocd label secret \
#          argocd-sentinel-oidc app.kubernetes.io/part-of=argocd
#      The operator preserves foreign labels on update, but re-run this if
#      the secret is ever deleted and recreated.

apiVersion: vault.gauchoracing.com/v1alpha1
kind: VaultSecretSync
metadata:
  name: argocd-sentinel-oidc
  namespace: argocd
spec:
  serviceAccountName: default
  target:
    name: argocd-sentinel-oidc
    type: Opaque
  refreshInterval: 5m
  secrets:
    oidc.clientID: argocd-prod.oidc_client_id
    oidc.clientSecret: argocd-prod.oidc_client_secret
