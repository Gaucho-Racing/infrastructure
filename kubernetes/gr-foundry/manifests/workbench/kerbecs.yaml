apiVersion: apps/v1
kind: Deployment
metadata:
  name: kerbecs
  namespace: workbench
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kerbecs
  template:
    metadata:
      labels:
        app: kerbecs
    spec:
      containers:
        - name: kerbecs
          image: bk1031/kerbecs:latest
          ports:
            - containerPort: 10310
              name: gateway
            - containerPort: 10300
              name: admin
          env:
            - name: KERBECS_CONFIG
              value: /etc/kerbecs/kerbecs.yaml
            - name: ENV
              value: PROD
            - name: KERBECS_USER
              value: admin
            - name: KERBECS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: workbench-secrets
                  key: KERBECS_PASSWORD
          readinessProbe:
            httpGet:
              path: /api/ping
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: gateway
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: kerbecs-config
              mountPath: /etc/kerbecs
              readOnly: true
      volumes:
        - name: kerbecs-config
          configMap:
            name: kerbecs-config
---
apiVersion: v1
kind: Service
metadata:
  name: kerbecs
  namespace: workbench
spec:
  selector:
    app: kerbecs
  ports:
    - name: gateway
      port: 10310
      targetPort: gateway
    - name: admin
      port: 10300
      targetPort: admin
